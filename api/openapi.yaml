openapi: 3.0.3
info:
  title: Club Management System API
  description: This is the API definition of the Club Management System.
  version: 0.0.0
  contact:
    name: team-devoops
servers:
  - url: /api/v1
    description: Base URL for all API endpoints
paths:
  /organization/sports:
    get:
      operationId: getAllSports
      tags:
        - organization
      summary: Get all sports
      description: |
        Returns a list of all sports registered in the organization.
        - All authenticated users: can access this endpoint.
      responses:
        "200":
          description: The request was successful, and the server has returned the requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      parameters: []
    post:
      operationId: createSport
      tags:
        - organization
      summary: Create sport
      description: |
        Creates a new sport in the organization.
        - Admins: can create sports.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating a new sport.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportCreate"
  /organization/sports/{sport_id}:
    patch:
      operationId: updateSport
      tags:
        - organization
      summary: Update sport
      description: |
        Partially updates an existing sport's details.
        - Directors: can update all fields except directors.
        - Admins: can update all fields.
      parameters:
        - $ref: "#/components/parameters/sport_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      requestBody:
        required: true
        description: The request body for partially updating a sport.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportPartialUpdate"
      security:
        - BearerJwt: []
    delete:
      operationId: deleteSport
      tags:
        - organization
      summary: Delete sport
      description: |
        Deletes a sport from the organization.
        - Admins: can delete sports.
      parameters:
        - $ref: "#/components/parameters/sport_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    get:
      operationId: getSport
      tags:
        - organization
      summary: Get sport
      description: |
        Returns the details of a specific sport.
        - All authenticated users: can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/sport_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /organization/teams:
    get:
      operationId: getAllTeams
      tags:
        - organization
      summary: Get all teams
      description: |
        Returns a list of all teams in the organization.
        - All authenticated users: can access this endpoint.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    post:
      operationId: createTeam
      tags:
        - organization
      summary: Create team
      description: |
        Creates a new team in the organization.
        - Directors: can create teams for their own sport.
        - Admins: can create teams for any sport.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating a new team.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
  /organization/teams/{team_id}:
    get:
      operationId: getTeam
      tags:
        - organization
      summary: Get team
      description: |
        Returns the details of a specific team.
        - All authenticated users: can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/team_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    patch:
      operationId: updateTeam
      tags:
        - organization
      summary: Update team
      description: |
        Partially updates a team's details.
        - Trainers: can update all fields except sport and trainers.
        - Directors: can update all fields except sport.
        - Admins: can update all fields.
      parameters:
        - $ref: "#/components/parameters/team_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for partially updating a team.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPartialUpdate"
    delete:
      operationId: deleteTeam
      tags:
        - organization
      summary: Delete team
      description: |
        Deletes a team from the organization.
        - Directors: can delete teams in their sport.
        - Admins: can delete any team.
      parameters:
        - $ref: "#/components/parameters/team_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /members:
    get:
      operationId: getAllMembers
      tags:
        - members
      summary: Get all members
      description: |
        Returns a list of all members in the organization.
        - All authenticated users: can access this endpoint.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    post:
      operationId: createMember
      tags:
        - members
      summary: Create member
      description: |
        Creates a new member in the organization. Includes a password field for setting initial credentials.
        - Admins: can create members.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating a new member.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
  /members/dashboard:
    get:
      operationId: getDashboard
      tags:
        - members
      summary: Get the caller's dashboard
      description: |
        Returns dashboard data tailored to the caller's highest role
        (admin > director > trainer > trainee). The `role` field discriminates the
        concrete shape of the response.
        - All authenticated users: can access their own dashboard.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /members/{member_id}:
    get:
      operationId: getMemberDetails
      tags:
        - members
      summary: Get member details
      description: |
        Returns the full details of a specific member.
        - Members themselves: can view their own details.
        - Team members: can view details of others in the same team.
        - Trainers: can view details of members in their team.
        - Directors: can view details of members in their sport.
        - Admins: can view any member's details.
      parameters:
        - $ref: "#/components/parameters/member_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    patch:
      operationId: updateMemberDetails
      tags:
        - members
      summary: Update member details
      description: |
        Partially updates the details of a specific member.
        - Members themselves: can update their own details.
        - Admins: can update any member's details.
      parameters:
        - $ref: "#/components/parameters/member_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for partially updating a member.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPartialUpdate"
    delete:
      operationId: deleteMember
      tags:
        - members
      summary: Delete member
      description: |
        Deletes a member from the organization.
        - Admins: can delete members.
      parameters:
        - $ref: "#/components/parameters/member_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /events:
    get:
      operationId: getAllEvents
      tags:
        - events
      summary: Get all events
      description: |
        Returns a list of all events.
        - All authenticated users: can see events linked to their team or sport, or events where they are an attendee.
        - Creators: can see all events they created.
        - Admins: can see all events.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    post:
      operationId: createEvent
      tags:
        - events
      summary: Create event
      description: |
        Creates a new event.
        - Directors: can create events for their sport.
        - Trainers: can create events for their team.
        - Admins: can create any event.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating a new event.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
  /events/{event_id}:
    get:
      operationId: getEventDetails
      tags:
        - events
      summary: Get event details
      description: |
        Returns the details of a specific event.
        - All authenticated users: can access events linked to their team or sport, or events where they are an attendee.
        - Creators: can view events they created.
        - Admins: can view any event.
      parameters:
        - $ref: "#/components/parameters/event_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    patch:
      operationId: updateEventDetails
      tags:
        - events
      summary: Update event details
      description: |
        Partially updates the details of a specific event.
        - Creators: can update events they created.
        - Directors: can update events linked to their sport.
        - Admins: can update any event.
      parameters:
        - $ref: "#/components/parameters/event_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for partially updating an event.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPartialUpdate"
    delete:
      operationId: deleteEvent
      tags:
        - events
      summary: Delete event
      description: |
        Deletes a specific event.
        - Creators: can delete events they created.
        - Directors: can delete events linked to their sport.
        - Admins: can delete any event.
      parameters:
        - $ref: "#/components/parameters/event_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /feedback:
    get:
      operationId: getAllFeedback
      tags:
        - feedback
      summary: Get all feedback
      description: |
        Returns a list of all feedback entries.
        - Creators: can see feedback they submitted.
        - Members: can see feedback about themselves.
        - Admins: can see all feedback.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    post:
      operationId: createFeedback
      tags:
        - feedback
      summary: Create feedback
      description: |
        Creates a new feedback entry for a member.
        - Trainers: can create feedback for their trainees.
        - Admins: can create feedback for any member.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating new feedback.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreate"
  /feedback/{feedback_id}:
    get:
      operationId: getFeedbackDetails
      tags:
        - feedback
      summary: Get feedback details
      description: |
        Returns the details of a specific feedback entry.
        - Creators: can view feedback they submitted.
        - Members: can view feedback about themselves.
        - Admins: can view any feedback.
      parameters:
        - $ref: "#/components/parameters/feedback_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    delete:
      operationId: deleteFeedback
      tags:
        - feedback
      summary: Delete feedback
      description: |
        Deletes a specific feedback entry.
        - Creators: can delete feedback they submitted.
        - Admins: can delete any feedback.
      parameters:
        - $ref: "#/components/parameters/feedback_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    patch:
      operationId: updateFeedbackDetails
      tags:
        - feedback
      summary: Update feedback details
      description: |
        Partially updates a specific feedback entry.
        - Creators: can update feedback they submitted.
        - Admins: can update any feedback.
      parameters:
        - $ref: "#/components/parameters/feedback_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for partially updating a specific feedback.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackPartialUpdate"
  /finance/balances:
    get:
      operationId: getAllBalances
      tags:
        - finance
      summary: Get all balances
      description: |
        Returns a list of all member balances.
        - Directors: can view balances of members in their sport.
        - Admins: can view all balances.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /finance/balances/{member_id}:
    get:
      operationId: getMemberBalance
      tags:
        - finance
      summary: Get member balance
      description: |
        Returns the balance of a specific member.
        - Members themselves: can view their own balance.
        - Directors: can view balances of members in their sport.
        - Admins: can view any member's balance.
      parameters:
        - $ref: "#/components/parameters/member_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /finance/transactions:
    get:
      operationId: getAllTransactions
      tags:
        - finance
      summary: Get all transactions
      description: |
        Returns a list of all transactions. Users only see transactions where they are the member or the creator.
        - Members: can see transactions they are part of.
        - Creators: can see transactions they created.
        - Directors: can see transactions for members in their sport.
        - Admins: can see all transactions.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    post:
      operationId: createTransaction
      tags:
        - finance
      summary: Create transaction
      description: |
        Creates a new financial transaction for a member.
        - Directors: can create transactions for members in their sport.
        - Admins: can create transactions for any member.
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for creating a new transaction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
  /finance/transactions/{transaction_id}:
    get:
      operationId: getTransaction
      tags:
        - finance
      summary: Get transaction
      description: |
        Returns the details of a specific transaction.
        - Members: can view transactions they are part of.
        - Creators: can view transactions they created.
        - Directors: can view transactions for members in their sport.
        - Admins: can view any transaction.
      parameters:
        - $ref: "#/components/parameters/transaction_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    patch:
      operationId: updateTransaction
      tags:
        - finance
      summary: Update transaction
      description: |
        Partially updates a specific transaction. The member field can only be changed by admins.
        - Creators: can update transactions they created (except the member field).
        - Admins: can update any transaction including the member field.
      parameters:
        - $ref: "#/components/parameters/transaction_id"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The request body for partially updating a transaction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPartialUpdate"
    delete:
      operationId: deleteTransaction
      tags:
        - finance
      summary: Delete transaction
      description: |
        Deletes a specific transaction.
        - Creators: can delete transactions they created.
        - Admins: can delete any transaction.
      parameters:
        - $ref: "#/components/parameters/transaction_id"
      responses:
        "204":
          description: The request was successful, but there is no content to return in
            the response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
  /letters/mail:
    post:
      operationId: sendMail
      tags:
        - letters
      summary: Send mail
      description: |
        Sends a personalized mass email. The body carries a `subject` and an HTML `template`; the
        template's placeholder tokens are replaced with each receiver's data, and one email is sent
        per receiver.

        Receivers are determined from the caller's highest role:
        - **Admin**: all members.
        - **Director**: all directors, trainers, and trainees in their sport.
        - **Trainer**: all trainers and trainees of their team.
        - **Trainee / member-only**: forbidden — cannot use the letter service (`403`).

        Assumes a director directs exactly one sport, a trainer trains exactly one team, and a
        trainee belongs to exactly one team.

        Supported placeholder tokens (`{{snake_case}}`; an unknown or empty value resolves to an
        empty string):
        - Member: `{{first_name}}`, `{{last_name}}`, `{{full_name}}`, `{{email}}`, `{{address}}`,
          `{{phone_number}}`, `{{birthday}}`, `{{joining_date}}`.
        - Organization: `{{team_name}}`, `{{sport_name}}` — the receiver's team/sport, blank if none.
        - Finance: `{{balance}}` — the receiver's current balance, formatted (e.g. `€12.50`).
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      requestBody:
        required: true
        description: The subject and HTML template for the personalized mass email.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailRequest"
      parameters: []
  /letters/pdf:
    post:
      operationId: getPdf
      tags:
        - letters
      summary: Get pdf
      description: |
        Generates a personalized mass-letter PDF. The body carries an HTML `template` whose
        placeholder tokens are replaced with each receiver's data. One letter is rendered per
        receiver — a layout block with the recipient's name and address followed by the
        token-substituted template — and all letters are concatenated into a single PDF.

        Receivers are determined from the caller's highest role:
        - **Admin**: all members.
        - **Director**: all directors, trainers, and trainees in their sport.
        - **Trainer**: all trainers and trainees of their team.
        - **Trainee / member-only**: forbidden — cannot use the letter service (`403`).

        Assumes a director directs exactly one sport, a trainer trains exactly one team, and a
        trainee belongs to exactly one team.

        Supported placeholder tokens (`{{snake_case}}`; an unknown or empty value resolves to an
        empty string):
        - Member: `{{first_name}}`, `{{last_name}}`, `{{full_name}}`, `{{email}}`, `{{address}}`,
          `{{phone_number}}`, `{{birthday}}`, `{{joining_date}}`.
        - Organization: `{{team_name}}`, `{{sport_name}}` — the receiver's team/sport, blank if none.
        - Finance: `{{balance}}` — the receiver's current balance, formatted (e.g. `€12.50`).
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
      parameters: []
      requestBody:
        required: true
        description: The HTML template for the personalized mass-letter PDF.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfRequest"
  /helper/reports/member/{member_id}:
    post:
      operationId: generateMemberReport
      tags:
        - helper
      summary: Generate member report
      description: |
        Kicks off asynchronous generation of an AI report for a member. Returns immediately; the
        finished report is persisted and can later be fetched via the report endpoints.
        - The member themselves: can generate their own report.
        - Admin: can generate a report for any member.
      responses:
        "202":
          description: The request was accepted and report generation has been started.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/member_id"
      security:
        - BearerJwt: []
    get:
      operationId: listMemberReports
      tags:
        - helper
      summary: List member reports
      description: |
        Lists the stored report summaries (without text) for a member, newest first.
        - The member themselves: can list their own reports.
        - Admin: can list reports for any member.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberReportSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/member_id"
      security:
        - BearerJwt: []
  /helper/reports/team/{team_id}:
    post:
      operationId: generateTeamReport
      tags:
        - helper
      summary: Generate team report
      description: |
        Kicks off asynchronous generation of an AI report for a team. Returns immediately; the
        finished report is persisted and can later be fetched via the report endpoints.
        - Trainers of the team: can generate the team's report.
        - Admin: can generate a report for any team.
      responses:
        "202":
          description: The request was accepted and report generation has been started.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/team_id"
      security:
        - BearerJwt: []
    get:
      operationId: listTeamReports
      tags:
        - helper
      summary: List team reports
      description: |
        Lists the stored report summaries (without text) for a team, newest first.
        - Trainers of the team: can list the team's reports.
        - Admin: can list reports for any team.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamReportSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/team_id"
      security:
        - BearerJwt: []
  /helper/reports/{report_id}:
    get:
      operationId: getReport
      tags:
        - helper
      summary: Get report
      description: |
        Returns a single stored report including its full text. Works for both member and team
        reports; the `kind` field indicates which, and the matching reference is populated.
        - Member reports: the member themselves or an admin.
        - Team reports: a trainer of the team or an admin.
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/report_id"
      security:
        - BearerJwt: []
    delete:
      operationId: deleteReport
      tags:
        - helper
      summary: Delete report
      description: |
        Deletes a single stored report (member or team).
        - Member reports: the member themselves or an admin.
        - Team reports: a trainer of the team or an admin.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/report_id"
      security:
        - BearerJwt: []
components:
  responses:
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The server cannot find the requested resource. The endpoint may be
        invalid or the resource may no longer exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestResponse"
    Conflict:
      description: The request could not be completed due to a conflict with the
        current state of the resource. Resolve the conflict and try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoContent:
      description: The request was successful, but there is no content to return in
        the response.
    Unauthorized:
      description: Authentication is required to access the requested resource. The
        client must include the appropriate credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The server understood the request, but refuses to authorize it.
        Ensure the client has appropriate permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: Json Web Token (JWT)
      description: "Jwt Auth: Authenticated requests contain a valid Json Web Token
        (JWT) as part of the `Authorization: Bearer <JWT>` header."
  parameters:
    sport_id:
      name: sport_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    team_id:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    member_id:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    event_id:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    feedback_id:
      name: feedback_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    transaction_id:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    report_id:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    BadRequestResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorResponse"
      required:
        - message
    Reference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      description: A lightweight reference to another entity — its id plus a display name.
    MemberReportSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/Reference"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - member
        - created_at
      description: Summary of a stored member report, without its generated text.
    TeamReportSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        team:
          $ref: "#/components/schemas/Reference"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - team
        - created_at
      description: Summary of a stored team report, without its generated text.
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - member
            - team
        member:
          $ref: "#/components/schemas/Reference"
        team:
          $ref: "#/components/schemas/Reference"
        created_at:
          type: string
          format: date-time
        text:
          type: string
      required:
        - id
        - kind
        - created_at
        - text
      description: |
        A stored report including its generated text. `kind` indicates whether it is a member or
        team report; the matching `member`/`team` reference is populated accordingly.
    Dashboard:
      oneOf:
        - $ref: "#/components/schemas/AdminDashboard"
        - $ref: "#/components/schemas/DirectorDashboard"
        - $ref: "#/components/schemas/TrainerDashboard"
        - $ref: "#/components/schemas/TraineeDashboard"
      discriminator:
        propertyName: role
        mapping:
          admin: "#/components/schemas/AdminDashboard"
          director: "#/components/schemas/DirectorDashboard"
          trainer: "#/components/schemas/TrainerDashboard"
          trainee: "#/components/schemas/TraineeDashboard"
      description: |
        Role-specific dashboard payload. The `role` property discriminates which concrete
        shape is returned, following the caller's highest role (admin > director > trainer > trainee).
    AdminDashboard:
      type: object
      properties:
        role:
          type: string
        total_members:
          type: integer
        total_sports:
          type: integer
        total_teams:
          type: integer
        total_directors:
          type: integer
        total_trainers:
          type: integer
        total_balance_cents:
          type: integer
        events_this_week:
          type: integer
      required:
        - role
        - total_members
        - total_sports
        - total_teams
        - total_directors
        - total_trainers
        - total_balance_cents
        - events_this_week
      description: Club-wide aggregates shown to administrators.
    DirectorDashboard:
      type: object
      properties:
        role:
          type: string
        sport:
          $ref: "#/components/schemas/Reference"
        total_teams:
          type: integer
        total_members:
          type: integer
        sport_balance_cents:
          type: integer
        upcoming_events:
          type: integer
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamBalanceSummary"
      required:
        - role
        - sport
        - total_teams
        - total_members
        - sport_balance_cents
        - upcoming_events
        - teams
      description: Aggregates for the sport a director manages.
    TeamBalanceSummary:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/Reference"
        member_count:
          type: integer
        balance_cents:
          type: integer
      required:
        - team
        - member_count
        - balance_cents
      description: Per-team rollup of trainee count and aggregate balance.
    TrainerDashboard:
      type: object
      properties:
        role:
          type: string
        team:
          $ref: "#/components/schemas/Reference"
        total_members:
          type: integer
        upcoming_events:
          type: integer
        recent_feedback:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackSummary"
      required:
        - role
        - team
        - total_members
        - upcoming_events
        - recent_feedback
      description: Aggregates for the team a trainer manages, including feedback they authored.
    TraineeDashboard:
      type: object
      properties:
        role:
          type: string
        balance_cents:
          type: integer
        next_event:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EventSummary"
        upcoming_events:
          type: integer
        recent_feedback:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackSummary"
        recent_reports:
          type: array
          items:
            $ref: "#/components/schemas/MemberReportSummary"
      required:
        - role
        - balance_cents
        - next_event
        - upcoming_events
        - recent_feedback
        - recent_reports
      description: Personal aggregates shown to a trainee/member.
    Sport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date
        directors:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
      required:
        - id
        - name
        - description
        - created_at
        - directors
      description: The object representation of a Sport within the organization.
    SportCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        directors:
          type: array
          items:
            type: string
      required:
        - name
      description: Data transfer object for creating a new Sport.
    SportPartialUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        directors:
          type: array
          items:
            type: string
      description: Data transfer object for partially updating an existing Sport
        (PATCH operation).
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date
        address:
          type: string
        sport:
          $ref: "#/components/schemas/Reference"
        trainers:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        trainees:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
      required:
        - id
        - name
        - description
        - created_at
        - address
        - sport
        - trainers
        - trainees
      description: The object representation of a Team that belongs to a specific Sport.
    TeamCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        sport:
          type: string
          format: uuid
          description: ID of the sport this team belongs to.
        trainers:
          type: array
          items:
            type: string
        trainees:
          type: array
          items:
            type: string
      required:
        - name
        - sport
      description: Data transfer object for creating a new Team.
    TeamPartialUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        sport:
          type: string
          format: uuid
          description: ID of the sport this team belongs to.
        trainers:
          type: array
          items:
            type: string
        trainees:
          type: array
          items:
            type: string
      description: Data transfer object for partially updating an existing Team (PATCH
        operation).
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        birthday:
          type: string
          format: date
        phone_number:
          type: string
        address:
          type: string
        joining_date:
          type: string
          format: date
        information:
          type: string
      required:
        - id
        - first_name
        - last_name
        - email
        - birthday
        - phone_number
        - address
        - joining_date
        - information
      description: The object representation of a Member. All users are represented as a member.
    MemberSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
      required:
        - id
        - first_name
        - last_name
        - email
      description: A simplified representation of a Member, typically used in list views.
    MemberPartialUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
