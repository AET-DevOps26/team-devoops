tags:
  - name: organization
    description: Endpoints related to managing the overall organization, including sports and teams.
  - name: members
    description: Endpoints related to managing members of the organization (which represent all users).
  - name: events
    description: Endpoints related to managing events such as training sessions and matches.
  - name: feedback
    description: Endpoints related to managing feedback provided by trainers to members for events.
  - name: finance
    description: Endpoints related to managing financial transactions and balances for members.
  - name: letters
    description: Endpoints related to generating and sending letters from templates, such as emails and PDFs.
  - name: helper
    description: Endpoints related to the genai helper functions, such as generating reports based on member data.
