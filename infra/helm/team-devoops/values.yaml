# Default values for the team-devoops umbrella chart.
# Each microservice is rendered from the generic templates below by ranging over
# `.Values.services`. Adding a service is just a new entry in that map.

global:
  image:
    registry: ghcr.io
    # GitHub owner/repo (lowercased). Per-service image is <registry>/<repository>/<service>.
    repository: aet-devops26/team-devoops
    # Overridden per deploy with `--set global.image.tag=<git-sha>`.
    tag: latest
  imagePullPolicy: IfNotPresent
  # Empty => use the cluster's default StorageClass (csi-rbd-sc on the TUM RKE2 cluster).
  storageClassName: ""
  # Names of pre-created docker-registry Secrets used to pull private ghcr images.
  imagePullSecrets:
    - name: ghcr-pull

# Shared in-cluster Postgres database — single DB, multiple schemas.
database:
  enabled: true
  name: app_db
  user: app_admin
  # Rendered into a Secret (db-credentials). Override in CI/prod via --set.
  password: app_admin_password
  host: app-database
  port: 5432
  # Per-service users. Override passwords via --set in CI/prod.
  users:
    organization:
      username: organization_user
      password: organization_password
    member:
      username: member_user
      password: member_password
    event:
      username: event_user
      password: event_password
    feedback:
      username: feedback_user
      password: feedback_password
    finance:
      username: finance_user
      password: finance_password
    letter:
      username: letter_user
      password: letter_password
    reports:
      username: reports_user
      password: reports_password
  image: postgres:15.6-alpine
  storageSize: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi

# py-genai-helper reads its configuration from a Secret created out-of-band by the
# pipeline (kubectl create secret --from-env-file). Helm only references it by name.
genai:
  secretName: genai-env

# ---------------------------------------------------------------------------
# Prometheus + Grafana. Like `genai` above, the scrape config / dashboards /
# provisioning are plain files in infra/prometheus/ and infra/grafana/ (the
# same ones docker-compose bind-mounts) — Helm can't reach outside its own
# chart directory via .Files.Get, so the pipeline loads them into ConfigMaps
# out-of-band (kubectl create configmap --from-file) and the chart only
# references those ConfigMaps by name.
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    configMapName: prometheus-config
    storageSize: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      # Actual usage on this cluster is ~50Mi; trimmed from 512Mi to make room for ollama
      # within the namespace's fixed 6Gi memory quota.
      limits:
        cpu: 150m
        memory: 150Mi
  grafana:
    image: grafana/grafana:11.4.0
    storageSize: 2Gi
    datasourcesConfigMapName: grafana-datasources
    dashboardProvidersConfigMapName: grafana-dashboard-providers
    dashboardsConfigMapName: grafana-dashboards
    alertingConfigMapName: grafana-alerting
    oauthClientId: grafana
    # Matches the existing forwardAuth.clientSecret pattern: a hardcoded default
    # for an internal-only confidential client, not treated as a rotated secret.
    oauthClientSecret: grafana-oauth-secret
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      # Documented peak usage is ~166Mi (the earlier 200Mi trim against that left "almost no
      # headroom" and had to be reverted -- see history). Live `kubectl top` right now shows only
      # ~70Mi, but that's an idle snapshot, not the peak. Trimmed from 280Mi to 240Mi: still ~74Mi
      # above the documented 166Mi peak, clearly more headroom than the rejected 200Mi/34Mi attempt,
      # while freeing some of the namespace's shared 6Gi quota for py-genai-helper.
      limits:
        cpu: 100m
        memory: 240Mi
  # Same out-of-band ConfigMap treatment as prometheus above (infra/loki/loki-config.yaml
  # is the same file docker-compose uses).
  loki:
    image: grafana/loki:3.2.0
    configMapName: loki-config
    storageSize: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      # Documented peak usage is ~153Mi (previously trimmed to make room for ollama, see prometheus
      # above). Live `kubectl top` right now shows only ~65Mi, but that's an idle snapshot, not the
      # peak. Trimmed from 220Mi to 200Mi: keeps ~47Mi above the documented peak -- more than
      # grafana's rejected 34Mi-headroom attempt above, so deliberately not pushed any lower.
      limits:
        cpu: 150m
        memory: 200Mi
  # Unlike loki/prometheus, alloy-config.alloy is Kubernetes-specific (loki.source.kubernetes,
  # not loki.source.docker) so it isn't shared with docker-compose -- it lives in this
  # chart's files/ and is embedded via .Files.Get like the Keycloak realm config, not
  # loaded out-of-band.
  alloy:
    image: grafana/alloy:v1.5.1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      # Actual usage is ~45Mi; trimmed to make room for ollama (see prometheus above).
      limits:
        cpu: 100m
        memory: 100Mi

# ---------------------------------------------------------------------------
# Local LLM backend for py-genai-helper (see services.py-genai-helper.env.OLLAMA_BASE_URL
# below). Reachable in-cluster only, on the same OLLAMA_BASE_URL used by docker-compose.
# infra/ollama/entrypoint_ollama.sh is shared with docker-compose, so -- like
# prometheus/loki above -- it's loaded into a ConfigMap out-of-band rather than via
# .Files.Get.
#
# The 1Gi limit this shipped with OOMKilled on the very first real inference call --
# it was sized from idle usage (~170Mi, nothing loaded), not actual model-loading cost.
# Loading qwen3:0.6b alone takes ~940Mi (492Mi model buffers + 448Mi KV cache at the
# default 4096-token context, verified live from the crashed container's own logs).
# OLLAMA_MAX_LOADED_MODELS=1 (below, in ollama-deployment.yaml) keeps the chat and
# embedding models from being resident at once, capping the peak to the larger of the
# two rather than their sum.
# ---------------------------------------------------------------------------
ollama:
  enabled: true
  image: ollama/ollama:latest
  configMapName: ollama-entrypoint
  storageSize: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

# ---------------------------------------------------------------------------
# Keycloak identity provider.
#   path     -> sub-path Keycloak listens on (KC_HTTP_RELATIVE_PATH).
#   hostname -> public-facing hostname Keycloak puts in issued tokens.
#   db       -> dedicated Postgres instance (mirrors .database.* pattern).
# NOTE: files/realm-config.json must be kept in sync with
#       infra/keycloak/realm-config.json.
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0.0
  path: /auth
  hostname: https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth
  adminUsername: admin
  adminPassword: admin
  # Constrain JVM heap so Keycloak stays within its memory limit.
  javaOptsAppend: "-Xms64m -Xmx256m"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  db:
    # enabled: false means Keycloak uses its built-in H2 database (start-dev mode).
    # The realm is re-imported from the ConfigMap on every pod start, so no
    # user/client data is lost. Set to true only if you need persistent sessions.
    enabled: true
    name: keycloak
    user: keycloak_user
    password: keycloak_password
    host: keycloak-database
    storageSize: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      # Actual usage is ~45Mi; trimmed to make room for ollama (see monitoring.prometheus above).
      limits:
        cpu: 100m
        memory: 100Mi

ingress:
  enabled: true
  className: nginx
  host: ge83mom-devops26.stud.k8s.aet.cit.tum.de
  tls:
    enabled: true
    # Secret nginx serves the cert from. With cert-manager this is created
    # automatically; otherwise it must reference a pre-existing TLS Secret.
    secretName: team-devoops-tls
    # cert-manager ClusterIssuer that issues the cert (TUM AET cluster).
    # Adds the cert-manager.io/cluster-issuer annotation on the ingresses.
    clusterIssuer: letsencrypt-prod

# ---------------------------------------------------------------------------
# Forward-auth: deploys oauth2-proxy as an OIDC session proxy and wires all
# nginx ingresses through it via auth_request. Keycloak and /oauth2/ are
# excluded from auth to prevent redirect loops.
# ---------------------------------------------------------------------------
forwardAuth:
  enabled: true
  oidcIssuerUrl: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
  clientId: "traefik-forward-auth"
  clientSecret: "traefik-forward-auth-secret"
  # 32+ character random string used to sign session cookies.
  # Override at deploy time: --set forwardAuth.cookieSecret="$FORWARD_AUTH_COOKIE_SECRET"
  # Generate with: openssl rand -base64 32
  cookieSecret: ""

# Rolling update strategy — maxSurge: 0 ensures the old pod is terminated before
# scheduling the new one, which is required to stay within the namespace CPU quota.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Default compute resources applied to every app container (overridable per service).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 384Mi

# ---------------------------------------------------------------------------
# Service catalogue. Keys are the Kubernetes object names.
#   path        -> ingress path prefix
#   port        -> container/Service port
#   db          -> inject SPRING_DATASOURCE_* env (ConfigMap + Secret)
#   health      -> HTTP readiness/liveness path (omit => TCP probe)
#   stripPrefix -> strip the path prefix before forwarding (Traefik parity)
#   image/tag   -> optional: override the default ghcr image/tag for this service
#   env         -> extra literal environment variables
#   envFromSecret -> inject all keys of an existing Secret as env
#   persistence -> optional: mount a PVC (RWO) into the container.
#                  mountPath, size (PVC storage request), fsGroup (pod-level
#                  securityContext.fsGroup, needed when the image runs as
#                  non-root -- see loki/grafana/prometheus deployments for the
#                  same reasoning). Only safe with a single replica and a
#                  rolling strategy that fully terminates the old pod first
#                  (see .Values.strategy below), which is the case here.
# ---------------------------------------------------------------------------
services:
  organization-service:
    path: /api/v1/organization
    port: 8080
    db: true
    dbUser: organization
    health: /actuator/health
    stripPrefix: true
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
      # Keycloak Admin REST API for syncing membership client-roles (KeycloakRoleService).
      # The org-role-sync service-account client is defined in files/realm-config.json.
      # Override KEYCLOAK_ADMIN_CLIENT_SECRET via --set in CI/prod.
      KEYCLOAK_BASE_URL: "http://keycloak:8080/auth"
      KEYCLOAK_REALM: "devops"
      KEYCLOAK_ADMIN_CLIENT_ID: "org-role-sync"
      KEYCLOAK_ADMIN_CLIENT_SECRET: "org-role-sync-secret"
      KEYCLOAK_ROLES_CLIENT: "devops-client"
  member-service:
    path: /api/v1/members
    port: 8080
    db: true
    dbUser: member
    health: /actuator/health
    stripPrefix: true
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
      # Keycloak Admin REST API for user provisioning (KeycloakService).
      KEYCLOAK_BASE_URL: "http://keycloak:8080/auth"
      KEYCLOAK_REALM: "devops"
  event-service:
    path: /api/v1/events
    port: 8080
    db: true
    dbUser: event
    health: /actuator/health
    stripPrefix: true
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
  feedback-service:
    path: /api/v1/feedback
    port: 8080
    db: true
    dbUser: feedback
    health: /actuator/health
    stripPrefix: true
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
  finance-service:
    path: /api/v1/finance
    port: 8080
    db: true
    dbUser: finance
    health: /actuator/health
    stripPrefix: true
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
  letter-service:
    path: /api/v1/letters
    port: 8080
    db: true
    dbUser: letter
    health: /actuator/health
    stripPrefix: true
    envFromSecret: letter-env
    env:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms64m"
  py-genai-helper:
    path: /api/v1/helper
    port: 5000
    db: true
    dbUser: reports
    health: /health
    stripPrefix: true
    # Flask routes here are bare (e.g. /reports/...), unlike the Spring services'
    # generated controllers which keep their own name in the path -- needs the
    # whole "/api/v1/helper" prefix removed, not just "/api/v1".
    fullStrip: true
    envFromSecret: genai-env
    env:
      KEYCLOAK_ISSUER_URL: "https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth/realms/devops"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs"
      OLLAMA_BASE_URL: "http://ollama:11434"
    # Persists the Chroma vector store (see services/py-genai-helper/rag.py) across pod
    # restarts/reschedules. fsGroup 1000 matches the Dockerfile's `adduser` app user
    # (confirmed uid/gid 1000 on python:3.12.9-slim-bookworm), which the CSI-provisioned
    # PVC would otherwise mount root-owned and unwritable to that user.
    persistence:
      mountPath: /code/vector-store
      size: 1Gi
      fsGroup: 1000
    resources:
      requests:
        cpu: 100m
        memory: 350Mi
      # The Chroma/onnxruntime RAG stack (see rag.py) alone -- before Flask/gunicorn/SQLAlchemy/auth
      # are even loaded -- profiled at ~205Mi during a cold index build in a local container run, so
      # the old 400Mi (sized for FAISS-era ~135Mi actual usage) is no longer enough headroom. Can't
      # just raise it freely though: the namespace's ResourceQuota caps limits.memory at 6Gi total,
      # and every other service's limit already commits ~5650Mi of that (verified live via
      # `kubectl get resourcequota` + summing pod limits), leaving at most ~494Mi of quota room for
      # this service -- a first attempt at 512Mi exceeded it, so the rollout couldn't schedule a
      # single pod, hit progressDeadlineSeconds, and got auto-rolled-back by CD. 450Mi fits with a
      # little quota slack left; re-check actual usage with `kubectl top` after this deploys, and if
      # it needs to go higher, another service's limit has to come down first (same trimming pattern
      # already used for prometheus/loki/grafana/alloy above).
      limits:
        cpu: 150m
        memory: 450Mi
  web-client:
    path: /
    port: 8080
    db: false
    health: /
    stripPrefix: false
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      # Actual usage is a few Mi; trimmed to make room for ollama (see monitoring.prometheus above).
      limits:
        cpu: 80m
        memory: 80Mi
  api-docs:
    path: /docs
    port: 8080
    db: false
    stripPrefix: false
    open: true
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      # Actual usage is a few Mi; trimmed to make room for ollama (see monitoring.prometheus above).
      limits:
        cpu: 80m
        memory: 80Mi
