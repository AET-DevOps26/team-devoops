{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "team-devoops.labels" (dict "name" "keycloak" "root" $) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "team-devoops.selectorLabels" (dict "name" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-devoops.selectorLabels" (dict "name" "keycloak") | nindent 8 }}
    spec:
      {{- if .Values.keycloak.db.enabled }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.keycloak.db.host }} 5432; do
                echo "waiting for keycloak-database..."
                sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            {{- if .Values.keycloak.db.enabled }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.keycloak.db.host | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.db.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: KC_DB_PASSWORD
            {{- end }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ .Values.keycloak.path | quote }}
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: JAVA_OPTS_APPEND
              value: {{ .Values.keycloak.javaOptsAppend | quote }}
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/roost
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
        # infra/keycloak/themes/roost/ has nested subdirectories (css/fonts/img), which a
        # single ConfigMap can't hold (kubectl create configmap --from-file=<dir> only picks
        # up files directly inside that directory, silently dropping subdirectories). Each
        # subdirectory is loaded into its own ConfigMap out-of-band (same pattern as
        # prometheus-config/loki-config), and this projected volume stitches all four back
        # into the theme's real directory layout under one mount point.
        - name: theme
          projected:
            sources:
              - configMap:
                  name: keycloak-theme-root
                  items:
                    - key: template.ftl
                      path: login/template.ftl
                    - key: theme.properties
                      path: login/theme.properties
              - configMap:
                  name: keycloak-theme-css
                  items:
                    - key: roost.css
                      path: login/resources/css/roost.css
              - configMap:
                  name: keycloak-theme-fonts
                  items:
                    - key: bebas-neue-latin-400-normal.woff2
                      path: login/resources/fonts/bebas-neue-latin-400-normal.woff2
                    - key: poppins-latin-400-normal.woff2
                      path: login/resources/fonts/poppins-latin-400-normal.woff2
                    - key: poppins-latin-500-normal.woff2
                      path: login/resources/fonts/poppins-latin-500-normal.woff2
                    - key: poppins-latin-600-normal.woff2
                      path: login/resources/fonts/poppins-latin-600-normal.woff2
                    - key: poppins-latin-700-normal.woff2
                      path: login/resources/fonts/poppins-latin-700-normal.woff2
              - configMap:
                  name: keycloak-theme-img
                  items:
                    - key: RoostFavIcon.svg
                      path: login/resources/img/RoostFavIcon.svg
                    - key: RoostIcon.svg
                      path: login/resources/img/RoostIcon.svg
{{- end }}
