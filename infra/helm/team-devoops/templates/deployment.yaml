{{- range $name, $svc := .Values.services }}
{{- $root := $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "team-devoops.labels" (dict "name" $name "root" $root) | nindent 4 }}
spec:
  {{- /* Omitted when HPA-managed: setting it here would make every `helm upgrade`
        reset replicas back to the default and fight the HPA's scaling decisions. */}}
  {{- if not (and $svc.autoscaling $svc.autoscaling.enabled) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  progressDeadlineSeconds: {{ $svc.progressDeadlineSeconds | default 600 }}
  strategy:
    {{- toYaml ($svc.strategy | default $root.Values.strategy) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "team-devoops.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-devoops.selectorLabels" (dict "name" $name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        {{- if $svc.persistence }}
        fsGroup: {{ $svc.persistence.fsGroup }}
        {{- end }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ $name }}
          image: {{ include "team-devoops.image" (dict "name" $name "svc" $svc "root" $root) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "team-devoops.containerSecurityContext" (dict "runAsNonRoot" (ne $svc.runAsNonRoot false)) | nindent 12 }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- /* Gives the endpoints controller time to remove this pod from Service
                routing before SIGTERM, so in-flight requests aren't dropped mid-rollout --
                matters most for maxUnavailable-driven rollouts, which briefly have zero
                healthy pods for a service otherwise. */}}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          {{- if $svc.persistence }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.persistence.mountPath }}
          {{- end }}
          {{- $env := $svc.env | default dict }}
          {{- if $env }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if or $svc.db $svc.envFromSecret }}
          envFrom:
            {{- if $svc.db }}
            - configMapRef:
                name: db-config-{{ $name }}
            - secretRef:
                name: db-credentials-{{ $svc.dbUser }}-service
            {{- end }}
            {{- if $svc.envFromSecret }}
            - secretRef:
                name: {{ $svc.envFromSecret }}
            {{- end }}
          {{- end }}
          {{- if $svc.health }}
          startupProbe:
            httpGet:
              path: {{ $svc.health }}
              port: {{ $svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ $svc.health }}
              port: {{ $svc.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.health }}
              port: {{ $svc.port }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $root.Values.resources) | nindent 12 }}
      {{- if $svc.persistence }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
---
{{- end }}
