{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    {{- include "team-devoops.labels" (dict "name" "loki" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "team-devoops.selectorLabels" (dict "name" "loki") | nindent 4 }}
  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP
{{- end }}
