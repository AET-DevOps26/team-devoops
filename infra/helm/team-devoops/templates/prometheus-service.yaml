{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "team-devoops.labels" (dict "name" "prometheus" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "team-devoops.selectorLabels" (dict "name" "prometheus") | nindent 4 }}
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
{{- end }}
