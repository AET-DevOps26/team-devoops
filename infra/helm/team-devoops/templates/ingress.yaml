{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host }}
{{- $tls := .Values.ingress.tls }}
{{- $fa := .Values.forwardAuth }}
# ---------------------------------------------------------------------------
# Stripped ingress: services whose OpenAPI-generated controllers keep their
# own service-name segment in the path (e.g. MembersApi maps "/members",
# OrganizationApi maps "/organization/teams"), so only the shared "/api/v1"
# prefix must be removed -- Traefik stripPrefix parity, which strips
# "/api/v1" and forwards the rest, name segment included.
# Auth-protected when forwardAuth is enabled.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-stripped
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-stripped" "root" $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.{{ $.Release.Namespace }}.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/oauth2/start?rd=$escaped_request_uri"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.stripPrefix (not $svc.fullStrip) }}
          - path: {{ printf "/api/v1(%s(?:/.*)?)$" (trimPrefix "/api/v1" $svc.path) }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Full-strip ingress: services whose own routes carry no service-name
# segment at all (py-genai-helper's Flask routes are bare, e.g. "/reports/..."),
# so the whole "/api/v1/<name>" prefix must be removed, not just "/api/v1".
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-stripped-full
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-stripped-full" "root" $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.{{ $.Release.Namespace }}.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/oauth2/start?rd=$escaped_request_uri"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.stripPrefix $svc.fullStrip }}
          - path: {{ printf "%s(/|$)(.*)" $svc.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Plain ingress: services served at their path as-is (web-client, api-docs).
# Auth-protected when forwardAuth is enabled.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-plain
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-plain" "root" $) | nindent 4 }}
  annotations:
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.{{ $.Release.Namespace }}.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/oauth2/start?rd=$escaped_request_uri"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and (not $svc.stripPrefix) (not $svc.open) }}
          - path: {{ $svc.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Open ingress: Keycloak (auth provider) and the forward-auth OAuth callback
# must never be behind forward-auth to avoid redirect loops.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-open
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-open" "root" $) | nindent 4 }}
  {{- if and $tls.enabled $tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.keycloak.enabled }}
          - path: {{ .Values.keycloak.path }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          {{- end }}
          {{- if $fa.enabled }}
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          {{- end }}
          {{- if .Values.monitoring.enabled }}
          # Grafana enforces its own Keycloak-backed, admin-only login (see
          # grafana-deployment.yaml) so it's excluded from oauth2-proxy the same
          # way Keycloak itself is -- routing it through oauth2-proxy too would
          # just be a redundant, weaker login gate in front of a stronger one.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          {{- end }}
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.open }}
          - path: {{ $svc.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
{{- end }}
