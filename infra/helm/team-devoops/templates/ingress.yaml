{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host }}
{{- $tls := .Values.ingress.tls }}
{{- $fa := .Values.forwardAuth }}
# ---------------------------------------------------------------------------
# Stripped ingress: services whose OpenAPI-generated controllers keep their
# own service-name segment in the path (e.g. MembersApi maps "/members",
# OrganizationApi maps "/organization/teams"), so only the shared "/api/v1"
# prefix must be removed -- Traefik stripPrefix parity, which strips
# "/api/v1" and forwards the rest, name segment included.
#
# Never routed through forwardAuth: every one of these services already runs
# its own Bearer-JWT check against Keycloak (Spring's oauth2ResourceServer /
# py-genai-helper's require_auth), so oauth2-proxy's cookie-based auth_request
# gate was pure redundancy on top of it.
#
# rewrite-target is "$1", not "/$1": the capture group already starts with its
# own leading slash (it captures e.g. "/organization/sports", not
# "organization/sports"), so prefixing it with another "/" sent nginx's
# actual rewritten request to the backend as "//organization/sports" --
# confirmed via Tomcat's own access log on organization-service (temporarily
# enabled via SERVER_TOMCAT_ACCESSLOG_* in values.yaml during this
# investigation). Spring accepted that double-slash path fine for
# unauthenticated requests (which is why every hand-built reproduction with
# curl/nc looked like a clean 401 and never pointed here), but with a real
# Bearer token attached it never reached a real controller method, which is
# what actually caused the login loop: the SPA's axios interceptor treats any
# 401 as a dead session and calls keycloak.login() again, and since Keycloak
# still has an active SSO session that silently re-approves, the whole thing
# loops between "/" and Keycloak's authorize endpoint instead of loading data.
# team-devoops-stripped-full below never had this bug because its capture
# group (from "(/|$)(.*)") does NOT include its own leading slash, so its
# "/$2" is correct as-is.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-stripped
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-stripped" "root" $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: $1
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.stripPrefix (not $svc.fullStrip) }}
          - path: {{ printf "/api/v1(%s(/|$)(.*))" (trimPrefix "/api/v1" $svc.path) }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Full-strip ingress: services whose own routes carry no service-name
# segment at all (py-genai-helper's Flask routes are bare, e.g. "/reports/..."),
# so the whole "/api/v1/<name>" prefix must be removed, not just "/api/v1".
#
# Never routed through forwardAuth, for the same reason as
# team-devoops-stripped above: py-genai-helper does its own Bearer-JWT
# validation (see auth.py's require_auth), so the oauth2-proxy cookie gate
# was pure redundancy on top of it.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-stripped-full
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-stripped-full" "root" $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.stripPrefix $svc.fullStrip }}
          - path: {{ printf "%s(/|$)(.*)" $svc.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Plain ingress: services served at their path as-is (web-client, api-docs).
# Auth-protected when forwardAuth is enabled.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-plain
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-plain" "root" $) | nindent 4 }}
  annotations:
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.{{ $.Release.Namespace }}.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/oauth2/start?rd=$escaped_request_uri"
    # Same header-size constraint as team-devoops-open's /oauth2/callback: this
    # ingress's auth_request subrequest hits oauth2-proxy's /oauth2/auth, which
    # re-issues the same chunked session Set-Cookie on every periodic token
    # refresh, not just at initial login. Without matching headroom here, an
    # already-logged-in session can still hit the same "upstream sent too big
    # header" 502 later, on a refresh rather than the callback.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and (not $svc.stripPrefix) (not $svc.open) }}
          - path: {{ $svc.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Open ingress: Keycloak (auth provider) and the forward-auth OAuth callback
# must never be behind forward-auth to avoid redirect loops.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-open
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-open" "root" $) | nindent 4 }}
  annotations:
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    # oauth2-proxy's default session store keeps the whole token set (access + id +
    # refresh) client-side, base64 in one or more chunked Set-Cookie headers -- for
    # a realm user carrying several client-role claims this response header block
    # can exceed nginx's default proxy_buffer_size. When that happens nginx can't
    # read the /oauth2/callback response at all and aborts with "upstream sent too
    # big header", which surfaces to the browser as a 502 right after login even
    # though oauth2-proxy's own access log shows the callback succeeded -- and
    # nginx's automatic upstream retry then replays the request with the
    # already-redeemed one-time code, so every retry fails Keycloak's token
    # exchange too. Only affects logins whose token set is large enough to cross
    # the buffer; an existing valid session cookie is unaffected, which is why this
    # was only reproducible for some users/browsers and not others.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.keycloak.enabled }}
          - path: {{ .Values.keycloak.path }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          {{- end }}
          {{- if $fa.enabled }}
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          {{- end }}
          {{- if .Values.monitoring.enabled }}
          # Grafana enforces its own Keycloak-backed, admin-only login (see
          # grafana-deployment.yaml) so it's excluded from oauth2-proxy the same
          # way Keycloak itself is -- routing it through oauth2-proxy too would
          # just be a redundant, weaker login gate in front of a stronger one.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          {{- end }}
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.open }}
          - path: {{ $svc.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
{{- end }}
