{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host }}
{{- $tls := .Values.ingress.tls }}
{{- $fa := .Values.forwardAuth }}
{{- $fa := .Values.forwardAuth }}
# ---------------------------------------------------------------------------
# Stripped ingress: services whose path prefix must be removed before the
# request reaches the backend (Traefik stripPrefix parity). Uses a regex
# capture group so `/api/v1/members/foo` -> `/foo`.
# Auth-protected when forwardAuth is enabled.
# Auth-protected when forwardAuth is enabled.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-stripped
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-stripped" "root" $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://traefik-forward-auth:4181"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/_oauth"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Uri $request_uri;
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.stripPrefix }}
          - path: {{ printf "%s(/|$)(.*)" $svc.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
# ---------------------------------------------------------------------------
# Plain ingress: services served at their path as-is (web-client, api-docs).
# Auth-protected when forwardAuth is enabled.
# Auth-protected when forwardAuth is enabled.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-devoops-plain
  labels:
    {{- include "team-devoops.labels" (dict "name" "ingress-plain" "root" $) | nindent 4 }}
  annotations:
    {{- if and $tls.enabled $tls.clusterIssuer }}
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $fa.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://traefik-forward-auth:4181"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ $host }}/_oauth"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Uri $request_uri;
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if $tls.secretName }}
      secretName: {{ $tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and (not $svc.stripPrefix) (not $svc.open) }}
          - path: {{ $svc.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
---
