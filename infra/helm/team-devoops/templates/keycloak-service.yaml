{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "team-devoops.labels" (dict "name" "keycloak" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "team-devoops.selectorLabels" (dict "name" "keycloak") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
