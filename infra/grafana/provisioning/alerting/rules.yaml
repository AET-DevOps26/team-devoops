apiVersion: 1

groups:
  - orgId: 1
    name: team-devoops-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: service-down
        title: Service down
        condition: threshold
        for: 1m
        noDataState: OK
        execErrState: Error
        data:
          - refId: query
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              expr: 'up{job=~"organization-service|member-service|event-service|feedback-service|finance-service|letter-service|py-genai-helper|traefik"}'
              instant: true
              range: false
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              refId: threshold
              type: classic_conditions
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["query"]
                  reducer:
                    type: last
                    params: []
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has been down for more than 1 minute"

      - uid: high-latency
        title: High p95 latency
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: query
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              expr: 'histogram_quantile(0.95, sum by (application) (rate(http_server_requests_seconds_bucket[5m])))'
              instant: true
              range: false
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              refId: threshold
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["query"]
                  reducer:
                    type: last
                    params: []
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} p95 latency has been above 1s for 5 minutes"
