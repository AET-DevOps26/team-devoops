name: team-devoops

services:
  py-genai-helper:
    build: ../services/py-genai-helper/
    container_name: py-genai-helper
    env_file:
      - ../services/py-genai-helper/.env
    expose:
      - 5000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.py-genai-helper.entrypoints=websecure"
      - "traefik.http.routers.py-genai-helper.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/helper`)"
      - "traefik.http.routers.py-genai-helper.tls=true"
      - "traefik.http.routers.py-genai-helper.tls.certresolver=le"
      - "traefik.http.middlewares.helper-stripprefix.stripprefix.prefixes=/api/v1/helper"
      - "traefik.http.routers.py-genai-helper.middlewares=helper-stripprefix"
      - "traefik.http.services.py-genai-helper.loadbalancer.server.port=5000"
    networks:
      - proxy

  organization-service:
    build: ../services/spring-organization
    container_name: organization-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.organization-service.entrypoints=websecure"
      - "traefik.http.routers.organization-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/organization`)"
      - "traefik.http.routers.organization-service.tls=true"
      - "traefik.http.routers.organization-service.tls.certresolver=le"
      - "traefik.http.middlewares.organization-stripprefix.stripprefix.prefixes=/api/v1/organization"
      - "traefik.http.routers.organization-service.middlewares=organization-stripprefix"
      - "traefik.http.services.organization-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  member-service:
    build: ../services/spring-member
    container_name: member-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.member-service.entrypoints=websecure"
      - "traefik.http.routers.member-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/members`)"
      - "traefik.http.routers.member-service.tls=true"
      - "traefik.http.routers.member-service.tls.certresolver=le"
      - "traefik.http.middlewares.member-stripprefix.stripprefix.prefixes=/api/v1/members"
      - "traefik.http.routers.member-service.middlewares=member-stripprefix"
      - "traefik.http.services.member-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  event-service:
    build: ../services/spring-event
    container_name: event-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.event-service.entrypoints=websecure"
      - "traefik.http.routers.event-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/events`)"
      - "traefik.http.routers.event-service.tls=true"
      - "traefik.http.routers.event-service.tls.certresolver=le"
      - "traefik.http.middlewares.event-stripprefix.stripprefix.prefixes=/api/v1/events"
      - "traefik.http.routers.event-service.middlewares=event-stripprefix"
      - "traefik.http.services.event-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  feedback-service:
    build: ../services/spring-feedback
    container_name: feedback-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.feedback-service.entrypoints=websecure"
      - "traefik.http.routers.feedback-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/feedback`)"
      - "traefik.http.routers.feedback-service.tls=true"
      - "traefik.http.routers.feedback-service.tls.certresolver=le"
      - "traefik.http.middlewares.feedback-stripprefix.stripprefix.prefixes=/api/v1/feedback"
      - "traefik.http.routers.feedback-service.middlewares=feedback-stripprefix"
      - "traefik.http.services.feedback-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  finance-service:
    build: ../services/spring-finance
    container_name: finance-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-service.entrypoints=websecure"
      - "traefik.http.routers.finance-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/finance`)"
      - "traefik.http.routers.finance-service.tls=true"
      - "traefik.http.routers.finance-service.tls.certresolver=le"
      - "traefik.http.middlewares.finance-stripprefix.stripprefix.prefixes=/api/v1/finance"
      - "traefik.http.routers.finance-service.middlewares=finance-stripprefix"
      - "traefik.http.services.finance-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  letter-service:
    build: ../services/spring-letter
    container_name: letter-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.letter-service.entrypoints=websecure"
      - "traefik.http.routers.letter-service.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/api/v1/letters`)"
      - "traefik.http.routers.letter-service.tls=true"
      - "traefik.http.routers.letter-service.tls.certresolver=le"
      - "traefik.http.middlewares.letter-stripprefix.stripprefix.prefixes=/api/v1/letters"
      - "traefik.http.routers.letter-service.middlewares=letter-stripprefix"
      - "traefik.http.services.letter-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  api-docs:
    image: swaggerapi/swagger-ui
    container_name: api-docs
    expose:
      - 8080
    environment:
      - SWAGGER_JSON=/app/openapi.yaml
      - BASE_URL=/docs
    volumes:
      - ../api/openapi.yaml:/app/openapi.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-docs.entrypoints=websecure"
      - "traefik.http.routers.api-docs.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.api-docs.tls=true"
      - "traefik.http.routers.api-docs.tls.certresolver=le"
      - "traefik.http.services.api-docs.loadbalancer.server.port=8080"
    networks:
      - proxy

  web-client:
    build: ../web-client/
    container_name: web-client
    expose:
      - 8080
    depends_on:
      - organization-service
      - member-service
      - event-service
      - feedback-service
      - finance-service
      - letter-service
      - py-genai-helper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-client.entrypoints=websecure"
      - "traefik.http.routers.web-client.rule=Host(`team-devoops.uaenorth.cloudapp.azure.com`)"
      - "traefik.http.routers.web-client.tls=true"
      - "traefik.http.routers.web-client.tls.certresolver=le"
      - "traefik.http.services.web-client.loadbalancer.server.port=8080"
    networks:
      - proxy

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP traffic to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (production CA) via HTTP-01 challenge
      - "--certificatesresolvers.le.acme.email=04.raphael.frank@tum.de"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy

  member-database:
    image: postgres:15.6-alpine
    container_name: member-db
    expose:
      - 5432
    environment:
      POSTGRES_USER: member_user
      POSTGRES_PASSWORD: member_password
      POSTGRES_DB: member_db
    volumes:
      - member_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member_user -d member_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

volumes:
  member_db_data:
  letsencrypt:

networks:
  proxy:
    name: proxy
  data:
    name: data
