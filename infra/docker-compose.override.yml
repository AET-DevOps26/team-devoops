# Local development override.
#
# Compose auto-merges this file ONLY when running `docker compose` with no `-f`
# flags. The production Ansible playbook always passes `-f infra/docker-compose.yml`
# explicitly, so this override is never used on the VM.
#
# Usage:
#     cd infra && docker compose up -d --build
#
# What this override does:
#   * Removes TLS (no Let's Encrypt, no HTTPS, no 443) -- local has no public DNS
#   * Strips the Host(...) requirement from every router so localhost works
#   * Disables the HTTP -> HTTPS redirect so plain http://localhost works
#   * Exposes the app database on localhost:5432 for direct DB client access
#
# Access locally:
#     http://localhost/                       web client
#     http://localhost/docs                   Swagger UI
#     http://localhost/dashboard              Grafana (monitoring)
#     http://localhost/api/v1/<service>/...   APIs
#     http://localhost:8080                   Traefik dashboard
#     localhost:5432  (app_admin/app_admin_password, db: app_db)   PostgreSQL

services:
  traefik:
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
    ports: !override
      - "80:80"
      - "8080:8080"

  py-genai-helper:
    environment:
      - KEYCLOAK_ISSUER_URL=http://localhost:8081/auth/realms/devops
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/auth/realms/devops/protocol/openid-connect/certs
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.py-genai-helper.entrypoints=web"
      - "traefik.http.routers.py-genai-helper.rule=PathPrefix(`/api/v1/helper`)"
      - "traefik.http.middlewares.helper-stripprefix.stripprefix.prefixes=/api/v1/helper"
      - "traefik.http.routers.py-genai-helper.middlewares=helper-stripprefix,forward-auth@file"
      - "traefik.http.services.py-genai-helper.loadbalancer.server.port=5000"

  organization-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.organization-service.entrypoints=web"
      - "traefik.http.routers.organization-service.rule=PathPrefix(`/api/v1/organization`)"
      - "traefik.http.middlewares.organization-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.organization-service.middlewares=organization-stripprefix,forward-auth@file"
      - "traefik.http.services.organization-service.loadbalancer.server.port=8080"

  member-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.member-service.entrypoints=web"
      - "traefik.http.routers.member-service.rule=PathPrefix(`/api/v1/members`)"
      - "traefik.http.middlewares.member-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.member-service.middlewares=member-stripprefix,forward-auth@file"
      - "traefik.http.services.member-service.loadbalancer.server.port=8080"

  event-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.event-service.entrypoints=web"
      - "traefik.http.routers.event-service.rule=PathPrefix(`/api/v1/events`)"
      - "traefik.http.middlewares.event-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.event-service.middlewares=event-stripprefix,forward-auth@file"
      - "traefik.http.services.event-service.loadbalancer.server.port=8080"

  feedback-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.feedback-service.entrypoints=web"
      - "traefik.http.routers.feedback-service.rule=PathPrefix(`/api/v1/feedback`)"
      - "traefik.http.middlewares.feedback-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.feedback-service.middlewares=feedback-stripprefix,forward-auth@file"
      - "traefik.http.services.feedback-service.loadbalancer.server.port=8080"

  finance-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.finance-service.entrypoints=web"
      - "traefik.http.routers.finance-service.rule=PathPrefix(`/api/v1/finance`)"
      - "traefik.http.middlewares.finance-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.finance-service.middlewares=finance-stripprefix,forward-auth@file"
      - "traefik.http.services.finance-service.loadbalancer.server.port=8080"

  letter-service:
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/auth/realms/devops
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.letter-service.entrypoints=web"
      - "traefik.http.routers.letter-service.rule=PathPrefix(`/api/v1/letters`)"
      - "traefik.http.middlewares.letter-stripprefix.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.letter-service.middlewares=letter-stripprefix,forward-auth@file"
      - "traefik.http.services.letter-service.loadbalancer.server.port=8080"

  api-docs:
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.api-docs.entrypoints=web"
      - "traefik.http.routers.api-docs.rule=PathPrefix(`/docs`)"
      - "traefik.http.services.api-docs.loadbalancer.server.port=8080"

  grafana:
    environment: !override
      - GF_SERVER_ROOT_URL=http://localhost/dashboard/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET:-grafana-oauth-secret}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:8081/auth/realms/devops/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/auth/realms/devops/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/auth/realms/devops/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin' || ''
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  web-client:
    build:
      args:
        VITE_KEYCLOAK_URL: http://localhost:8081/auth
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.web-client.entrypoints=web"
      - "traefik.http.routers.web-client.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-client.middlewares=forward-auth@file"
      - "traefik.http.services.web-client.loadbalancer.server.port=8080"

  keycloak:
    environment:
      KC_HOSTNAME: "http://localhost:8081/auth"
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  app-database:
    ports:
      - "5432:5432"

  traefik-forward-auth:
    restart: "no"
    extra_hosts:
      - "localhost:host-gateway"
    labels: !override
      - "traefik.enable=false"
    environment:
      - PROVIDERS_OIDC_ISSUER_URL=http://localhost:8081/auth/realms/devops
      - INSECURE_COOKIE=true
