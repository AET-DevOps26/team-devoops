# Roost-branded Keycloak login theme.
# Inherit templates and PatternFly base from the stock keycloak login theme,
# then layer Roost tokens on top via roost.css (loaded last so it wins).
parent=keycloak
import=common/keycloak

# Keep the parent's stylesheet (login.css) and append ours after it so the
# Roost overrides take precedence without re-shipping PatternFly.
styles=css/login.css css/roost.css

meta=viewport==width=device-width,initial-scale=1
