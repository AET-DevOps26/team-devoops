services:
  pyrecommender-service:
    build: services/py-recommender/
    container_name: pyrecommender-service
    env_file:
      - services/py-recommender/.env
    expose:
      - 5000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pyrecommender.entrypoints=pyrecommender"
      - "traefik.http.routers.pyrecommender.rule=PathPrefix(`/`)"
      - "traefik.http.services.pyrecommender.loadbalancer.server.port=5000"
    networks:
      - proxy

  member-service:
    build: services/spring-order/member-service
    container_name: member-service
    expose:
      - 8080
    depends_on:
      member-database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://member-database:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_user
      - SPRING_DATASOURCE_PASSWORD=member_password
      # Automatically create tables based on entities
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.member-service.entrypoints=member-service"
      - "traefik.http.routers.member-service.rule=PathPrefix(`/`)"
      - "traefik.http.services.member-service.loadbalancer.server.port=8080"
    networks:
      - proxy
      - data

  web-client:
    build: web-client/
    container_name: web-client
    expose:
    - 80
    depends_on:
      - member-service
      - pyrecommender-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-client.entrypoints=web-client"
      - "traefik.http.routers.web-client.rule=PathPrefix(`/`)"
      - "traefik.http.services.web-client.loadbalancer.server.port=80"
    networks:
      - proxy

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.pyrecommender.address=:5000"
      - "--entrypoints.member-service.address=:8001"
      - "--entrypoints.web-client.address=:3000"
    ports:
      - "3000:3000"
      - "5000:5000"
      - "8080:8080"
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  member-database:
    image: postgres:15.6-alpine
    container_name: member-db
    expose:
      - 5432
    environment:
      POSTGRES_USER: member_user
      POSTGRES_PASSWORD: member_password
      POSTGRES_DB: member_db
    volumes:
      - member_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member_user -d member_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

volumes:
  member_db_data:

networks:
  proxy:
  data:
