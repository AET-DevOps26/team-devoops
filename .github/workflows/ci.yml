          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Python - py-genai-helper
  # ------------------------------------------------------------------
  py-genai-helper:
    name: py-genai-helper (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/py-genai-helper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/py-genai-helper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -q

  # ------------------------------------------------------------------
  # Node / React - web-client
  # ------------------------------------------------------------------
  web-client:
    name: web-client (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Run tests (Vitest)
        run: pnpm test

      - name: Build (Vite)
        run: pnpm run build

  # ------------------------------------------------------------------
  # Whole-system Docker build
  # ------------------------------------------------------------------
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - member-service
      - organization-service
      - event-service
      - feedback-service
      - finance-service
      - letter-service
      - py-genai-helper
      - web-client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env files
        run: cp services/py-genai-helper/.env.example services/py-genai-helper/.env

      - name: Build all images via docker compose
        run: docker compose build

      - name: Verify expected image tags exist
        # Compose tags images as `<project>-<service>:latest`; project name
        # defaults to the working directory and can differ between hosts.
        run: |
          set -e
          missing=0
          for img in \
            team-devoops-organization-service:latest \
            team-devoops-member-service:latest \
            team-devoops-event-service:latest \
            team-devoops-feedback-service:latest \
            team-devoops-finance-service:latest \
            team-devoops-letter-service:latest \
            team-devoops-py-genai-helper:latest \
            team-devoops-web-client:latest; do
            if ! docker image inspect "$img" >/dev/null 2>&1; then
              echo "::error::Expected image '$img' not found after compose build."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Available images:"
            docker images
            exit 1
          fi

  # ------------------------------------------------------------------
  # CodeQL SAST - vulnerability scan of first-party code.
  # ------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ------------------------------------------------------------------
  # OpenAPI lint
  # ------------------------------------------------------------------
  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check OpenAPI file is non-empty
        id: check
        run: |
          if [ -s api/openapi.yaml ]; then
            echo "has_spec=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_spec=false" >> "$GITHUB_OUTPUT"
            echo "::notice::api/openapi.yaml is empty - skipping Spectral lint"
          fi

      - name: Lint OpenAPI with Spectral
        if: steps.check.outputs.has_spec == 'true'
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141  # v0.8.13
        with:
          file_glob: 'api/openapi.yaml'

  # ------------------------------------------------------------------
  # Aggregate gate - use this single check for branch protection.
  # ------------------------------------------------------------------
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - member-service
      - organization-service
      - event-service
      - feedback-service
      - finance-service
      - letter-service
      - py-genai-helper
      - web-client
      - docker-build
      - codeql
      - openapi-lint
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -E '"result":\s*"(failure|cancelled|skipped)"' > /dev/null; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
