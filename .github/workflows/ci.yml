name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Java / Spring Boot - organization-service
  # ------------------------------------------------------------------
  organization-service:
    name: organization-service (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/spring-organization
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint (Checkstyle)
        run: ./gradlew --no-daemon checkstyleMain

      - name: Build & test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-service-reports
          path: |
            services/spring-organization/build/reports/**
            services/spring-organization/build/test-results/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Java / Spring Boot - member-service
  # ------------------------------------------------------------------
  member-service:
    name: member-service (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
