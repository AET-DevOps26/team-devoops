name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy (Ansible)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Write compose .env file
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          ORGANIZATION_DB_PASSWORD: ${{ secrets.DB_ORGANIZATION_PASSWORD }}
          MEMBER_DB_PASSWORD: ${{ secrets.DB_MEMBER_PASSWORD }}
          EVENT_DB_PASSWORD: ${{ secrets.DB_EVENT_PASSWORD }}
          FEEDBACK_DB_PASSWORD: ${{ secrets.DB_FEEDBACK_PASSWORD }}
          FINANCE_DB_PASSWORD: ${{ secrets.DB_FINANCE_PASSWORD }}
          LETTER_DB_PASSWORD: ${{ secrets.DB_LETTER_PASSWORD }}
          REPORTS_DB_PASSWORD: ${{ secrets.DB_REPORTS_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_REALM_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_REALM_ADMIN_PASSWORD }}
          KEYCLOAK_REALM_USER_PASSWORD: ${{ secrets.KEYCLOAK_REALM_USER_PASSWORD }}
          FORWARD_AUTH_COOKIE_SECRET: ${{ secrets.FORWARD_AUTH_COOKIE_SECRET }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          FORWARD_AUTH_CLIENT_SECRET: ${{ secrets.FORWARD_AUTH_CLIENT_SECRET }}
          GRAFANA_OAUTH_CLIENT_SECRET: ${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}
        run: |
          cat > /tmp/compose.env << ENVFILE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          ORGANIZATION_DB_PASSWORD=$ORGANIZATION_DB_PASSWORD
          MEMBER_DB_PASSWORD=$MEMBER_DB_PASSWORD
          EVENT_DB_PASSWORD=$EVENT_DB_PASSWORD
          FEEDBACK_DB_PASSWORD=$FEEDBACK_DB_PASSWORD
          FINANCE_DB_PASSWORD=$FINANCE_DB_PASSWORD
          LETTER_DB_PASSWORD=$LETTER_DB_PASSWORD
          REPORTS_DB_PASSWORD=$REPORTS_DB_PASSWORD
          KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD
          KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD
          KEYCLOAK_REALM_ADMIN_PASSWORD=$KEYCLOAK_REALM_ADMIN_PASSWORD
          KEYCLOAK_REALM_USER_PASSWORD=$KEYCLOAK_REALM_USER_PASSWORD
          FORWARD_AUTH_COOKIE_SECRET=$FORWARD_AUTH_COOKIE_SECRET
          KEYCLOAK_ADMIN_CLIENT_SECRET=$KEYCLOAK_ADMIN_CLIENT_SECRET
          FORWARD_AUTH_CLIENT_SECRET=$FORWARD_AUTH_CLIENT_SECRET
          GRAFANA_OAUTH_CLIENT_SECRET=$GRAFANA_OAUTH_CLIENT_SECRET
          ENVFILE

      - name: Write genai .env file
        env:
          GENAI_ENV_CONTENT: ${{ secrets.GENAI_ENV_CONTENT }}
        run: printf '%s\n' "$GENAI_ENV_CONTENT" > /tmp/genai.env

      - name: Write letter .env file
        env:
          LETTER_ENV_CONTENT: ${{ secrets.LETTER_ENV_CONTENT }}
        run: printf '%s\n' "$LETTER_ENV_CONTENT" > /tmp/letter.env

      - name: Create inventory
        run: |
          cat > /tmp/inventory.yml << INVENTORY
          all:
            hosts:
              team_devoops_vm:
                ansible_host: ${{ secrets.VM_HOST }}
                ansible_user: azureuser
                ansible_ssh_private_key_file: ~/.ssh/deploy_key
                ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          INVENTORY

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i /tmp/inventory.yml \
            infra/ansible/playbook.yml \
            -e "repo_url=https://github.com/${{ github.repository }}.git" \
            -e "branch=${{ github.ref_name }}" \
            -e "compose_env_file=/tmp/compose.env" \
            -e "genai_env_file=/tmp/genai.env" \
            -e "letter_env_file=/tmp/letter.env"

  # ------------------------------------------------------------------
  # Build & push all service images to GitHub Container Registry.
  # Kubernetes pulls these (unlike the VM, which builds locally), so this
  # runs before the Helm deploy.
  # ------------------------------------------------------------------
  docker-push:
    name: docker-push (ghcr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: organization-service
            context: services/spring-organization
          - service: member-service
            context: services/spring-member
          - service: event-service
            context: services/spring-event
          - service: feedback-service
            context: services/spring-feedback
          - service: finance-service
            context: services/spring-finance
          - service: letter-service
            context: services/spring-letter
          - service: py-genai-helper
            context: services/py-genai-helper
          - service: web-client
            context: web-client
            build_args: "VITE_KEYCLOAK_URL=https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth"
          - service: api-docs
            context: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Default docker-container driver (not `driver: docker`): the docker driver
        # can't export cache at all ("Cache export is not supported for the docker
        # driver"), which breaks the type=gha cache-to below. This job only pushes
        # to ghcr, so nothing needs the image loaded into the local docker daemon.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest
          build-args: ${{ matrix.build_args || '' }}
          # Persists the BuildKit cache (including each Dockerfile's
          # --mount=type=cache,target=/root/.gradle) across workflow runs via GitHub's
          # cache backend -- without this, every run starts cold and every Spring service
          # re-resolves and re-downloads its entire dependency tree from scratch. Scoped
          # per service so the matrix jobs don't overwrite each other's cache entries.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------
  # Deploy to the RKE2 Kubernetes cluster via Helm.
  # ------------------------------------------------------------------
  deploy-k8s:
    name: deploy (Kubernetes/Helm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-push
    env:
      NAMESPACE: ge83mom-devops26
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster auth
        run: |
          kubectl get --raw /apis >/dev/null || {
            echo "::error::KUBECONFIG appears invalid/expired (system:unauthenticated) — rotate the secret."
            exit 1
          }

      - name: Create/refresh genai-env secret
        env:
          GENAI_ENV_CONTENT: ${{ secrets.GENAI_ENV_CONTENT }}
        run: |
          printf '%s\n' "$GENAI_ENV_CONTENT" > /tmp/genai.env
          kubectl -n "$NAMESPACE" create secret generic genai-env \
            --from-env-file=/tmp/genai.env \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Create/refresh letter-env secret
        env:
          LETTER_ENV_CONTENT: ${{ secrets.LETTER_ENV_CONTENT }}
        run: |
          printf '%s\n' "$LETTER_ENV_CONTENT" > /tmp/letter.env
          kubectl -n "$NAMESPACE" create secret generic letter-env \
            --from-env-file=/tmp/letter.env \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Create/refresh monitoring ConfigMaps
        # Same pattern as genai-env above: the chart only references these by name
        # (Helm can't reach outside its own chart directory via .Files.Get), so the
        # canonical files under infra/prometheus/ and infra/grafana/ -- the same
        # ones docker-compose bind-mounts -- are loaded into ConfigMaps here.
        run: |
          kubectl -n "$NAMESPACE" create configmap prometheus-config \
            --from-file=infra/prometheus/prometheus.yml \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap loki-config \
            --from-file=infra/loki/loki-config.yaml \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap grafana-datasources \
            --from-file=infra/grafana/provisioning/datasources \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap grafana-dashboard-providers \
            --from-file=infra/grafana/provisioning/dashboards \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap grafana-alerting \
            --from-file=infra/grafana/provisioning/alerting \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap grafana-dashboards \
            --from-file=infra/grafana/dashboards \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap ollama-entrypoint \
            --from-file=infra/ollama/entrypoint_ollama.sh \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Create/refresh keycloak theme ConfigMaps
        # infra/keycloak/themes/roost/ has nested subdirectories (css/fonts/img); a single
        # ConfigMap can't hold those (--from-file=<dir> only picks up files directly inside
        # that directory, silently dropping subdirectories), so each subdirectory gets its
        # own ConfigMap here and the chart's projected volume (keycloak-deployment.yaml)
        # stitches them back into the theme's real directory layout.
        run: |
          kubectl -n "$NAMESPACE" create configmap keycloak-theme-root \
            --from-file=infra/keycloak/themes/roost/login/template.ftl \
            --from-file=infra/keycloak/themes/roost/login/theme.properties \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap keycloak-theme-css \
            --from-file=infra/keycloak/themes/roost/login/resources/css \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap keycloak-theme-fonts \
            --from-file=infra/keycloak/themes/roost/login/resources/fonts \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl -n "$NAMESPACE" create configmap keycloak-theme-img \
            --from-file=infra/keycloak/themes/roost/login/resources/img \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Unlock stuck Helm release (if any)
        run: |
          for secret in $(kubectl -n "$NAMESPACE" get secret \
              -l "owner=helm,name=team-devoops" -o name 2>/dev/null); do
            status=$(kubectl -n "$NAMESPACE" get "$secret" \
              -o jsonpath='{.metadata.labels.status}' 2>/dev/null || echo "")
            if [[ "$status" == pending-* || "$status" == "failed" ]]; then
              echo "Deleting stuck Helm secret $secret (status=$status)"
              kubectl -n "$NAMESPACE" delete "$secret"
            fi
          done

      - name: Pre-upgrade ingress migration
        run: |
          # team-devoops-plain previously contained the /auth (Keycloak) path.
          # It has been moved to team-devoops-open. Delete the old ingress so
          # the nginx admission webhook does not reject the new one for duplicate paths.
          kubectl -n "$NAMESPACE" delete ingress team-devoops-plain --ignore-not-found

      - name: Helm upgrade
        run: |
          helm upgrade --install team-devoops infra/helm/team-devoops \
            --namespace "$NAMESPACE" \
            --set global.image.tag=${{ github.sha }} \
            --set keycloak.hostname=https://ge83mom-devops26.stud.k8s.aet.cit.tum.de/auth \
            --set database.password="${{ secrets.DB_ADMIN_PASSWORD }}" \
            --set database.users.organization.password="${{ secrets.DB_ORGANIZATION_PASSWORD }}" \
            --set database.users.member.password="${{ secrets.DB_MEMBER_PASSWORD }}" \
            --set database.users.event.password="${{ secrets.DB_EVENT_PASSWORD }}" \
            --set database.users.feedback.password="${{ secrets.DB_FEEDBACK_PASSWORD }}" \
            --set database.users.finance.password="${{ secrets.DB_FINANCE_PASSWORD }}" \
            --set database.users.letter.password="${{ secrets.DB_LETTER_PASSWORD }}" \
            --set database.users.reports.password="${{ secrets.DB_REPORTS_PASSWORD }}" \
            --set keycloak.adminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set keycloak.db.password="${{ secrets.KEYCLOAK_DB_PASSWORD }}" \
            --set keycloak.users.admin.password="${{ secrets.KEYCLOAK_REALM_ADMIN_PASSWORD }}" \
            --set keycloak.users.user.password="${{ secrets.KEYCLOAK_REALM_USER_PASSWORD }}" \
            --set forwardAuth.cookieSecret="${{ secrets.FORWARD_AUTH_COOKIE_SECRET }}" \
            --set forwardAuth.clientSecret="${{ secrets.FORWARD_AUTH_CLIENT_SECRET }}" \
            --set monitoring.grafana.oauthClientSecret="${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}" \
            --set services.organization-service.env.KEYCLOAK_ADMIN_CLIENT_SECRET="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set services.member-service.env.KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --rollback-on-failure --timeout 15m
