# Ruff configuration for py-recommender.
line-length = 120
target-version = "py312"

extend-exclude = [
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]

[lint.per-file-ignores]
"tests/*" = ["B"]
